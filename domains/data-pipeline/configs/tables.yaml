silver_transformations:
  customers:
    source: bronze.oracle.customers
    transformations:
      - type: clean_strings
        columns: [name, email, phone]
        trim_spaces: true
        upper_case: false
      - type: deduplicate
        subset: [id]
      - type: validate_schema
        schema:
          id: integer
          name: string
          email: string
          created_at: timestamp
    partition_by: [created_date]

gold_metrics:
  daily_sales_summary:
    source: silver.sales.orders
    aggregations:
      group_by: [order_date]
      metrics:
        total_amount: [sum, avg, max]
        order_id: [count]
        customer_id: [countDistinct]
    schedule: "0 3 * * *"  # 03:00 diário
