name: Auto PR Description

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  update-pr-description:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Description
        id: generate-description
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          
          echo "## 📋 Resumo do Pull Request" > pr_description.md
          echo "" >> pr_description.md
          
          echo "### 🔍 Escopo das Mudanças" >> pr_description.md
          echo "" >> pr_description.md
          
          COMMITS=$(git log --format="%s" ${BASE_SHA}..${HEAD_SHA})
          
          SCOPE_COUNT=0
          FEATURES=()
          FIXES=()
          REFACTORS=()
          DOCS=()
          OTHERS=()
          
          while IFS= read -r commit_msg; do
            if [[ $commit_msg =~ ^(feat|feature)(\(.+\))?: ]]; then
              FEATURES+=("$commit_msg")
              SCOPE_COUNT=$((SCOPE_COUNT + 1))
            elif [[ $commit_msg =~ ^(fix|bugfix)(\(.+\))?: ]]; then
              FIXES+=("$commit_msg")
              SCOPE_COUNT=$((SCOPE_COUNT + 1))
            elif [[ $commit_msg =~ ^(refactor|refactoring)(\(.+\))?: ]]; then
              REFACTORS+=("$commit_msg")
              SCOPE_COUNT=$((SCOPE_COUNT + 1))
            elif [[ $commit_msg =~ ^(docs|documentation)(\(.+\))?: ]]; then
              DOCS+=("$commit_msg")
              SCOPE_COUNT=$((SCOPE_COUNT + 1))
            else
              OTHERS+=("$commit_msg")
            fi
          done <<< "$COMMITS"
          
          if [ ${#FEATURES[@]} -gt 0 ]; then
            echo "#### ✨ Novas Funcionalidades" >> pr_description.md
            for feat in "${FEATURES[@]}"; do
              echo "- $feat" >> pr_description.md
            done
            echo "" >> pr_description.md
          fi
          
          if [ ${#FIXES[@]} -gt 0 ]; then
            echo "#### 🐛 Correções" >> pr_description.md
            for fix in "${FIXES[@]}"; do
              echo "- $fix" >> pr_description.md
            done
            echo "" >> pr_description.md
          fi
          
          if [ ${#REFACTORS[@]} -gt 0 ]; then
            echo "#### ♻️ Refatorações" >> pr_description.md
            for ref in "${REFACTORS[@]}"; do
              echo "- $ref" >> pr_description.md
            done
            echo "" >> pr_description.md
          fi
          
          if [ ${#DOCS[@]} -gt 0 ]; then
            echo "#### 📚 Documentação" >> pr_description.md
            for doc in "${DOCS[@]}"; do
              echo "- $doc" >> pr_description.md
            done
            echo "" >> pr_description.md
          fi
          
          if [ ${#OTHERS[@]} -gt 0 ]; then
            echo "#### 📝 Outras Mudanças" >> pr_description.md
            for other in "${OTHERS[@]}"; do
              echo "- $other" >> pr_description.md
            done
            echo "" >> pr_description.md
          fi
          
          echo "### 📊 Estatísticas" >> pr_description.md
          echo "" >> pr_description.md
          echo "- **Total de commits**: $(git rev-list --count ${BASE_SHA}..${HEAD_SHA})" >> pr_description.md
          echo "- **Arquivos alterados**: $(git diff --name-only ${BASE_SHA}..${HEAD_SHA} | wc -l | tr -d ' ')" >> pr_description.md
          echo "- **Linhas adicionadas**: $(git diff --shortstat ${BASE_SHA}..${HEAD_SHA} | awk '{print $4}')" >> pr_description.md
          echo "- **Linhas removidas**: $(git diff --shortstat ${BASE_SHA}..${HEAD_SHA} | awk '{print $6}')" >> pr_description.md
          echo "" >> pr_description.md
          
          echo "### 🔗 Commits Incluídos" >> pr_description.md
          echo "" >> pr_description.md
          git log --format="- %s (%h)" ${BASE_SHA}..${HEAD_SHA} >> pr_description.md
          
          DESCRIPTION=$(cat pr_description.md)
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update PR Description
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const description = fs.readFileSync('pr_description.md', 'utf8');
            
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: description
            });

