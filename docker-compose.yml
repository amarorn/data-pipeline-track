version: "3.9"

# ============================================
# Track Data Platform - Docker Compose
# Infra de desenvolvimento: Jupyter + Spark client + Airflow
# ============================================

services:
  # ============================================
  # Jupyter Notebook + Spark (cliente)
  # ============================================
  jupyter:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.jupyter
    container_name: track-jupyter
    ports:
      - "9999:8888"
    env_file:
      - .env
    volumes:
      - ./notebooks:/app/notebooks
      - ./platform/shared-libs:/app/platform/shared-libs
      - ./domains:/app/domains
      - ./temp:/app/temp
    networks:
      - track-network
    restart: unless-stopped
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      SPARK_MASTER: "spark://spark-master:7077"

  # ============================================
  # Spark Cluster
  # ============================================
  spark-master:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
      - "7077:7077"
    networks:
      - track-network

  spark-worker-1:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_WEBUI_PORT=8082
    ports:
      - "8082:8082"
    networks:
      - track-network

  # ============================================
  # Airflow - Banco de Metadados (Postgres)
  # ============================================
  airflow-db:
    image: postgres:13
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./airflow/postgres-data:/var/lib/postgresql/data
    networks:
      - track-network
    restart: unless-stopped

  # ============================================
  # Airflow Webserver
  # ============================================
  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow-webserver
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "a2FjaGUtZGV2LWs="
      AIRFLOW__WEBSERVER__RBAC: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: "50000"
    command: ["webserver"]
    user: "50000:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    networks:
      - track-network
    restart: unless-stopped

  # ============================================
  # Airflow Scheduler
  # ============================================
  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow-scheduler
    depends_on:
      - airflow-db
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: "a2FjaGUtZGV2LWs="
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_UID: "50000"
    command: ["scheduler"]
    user: "50000:0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - track-network
    restart: unless-stopped

networks:
  track-network:
    driver: bridge
    name: track-platform-network
