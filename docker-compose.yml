# ============================================
# Track Data Platform - Docker Compose
# Infra de desenvolvimento: Jupyter + Spark client + Airflow
# ============================================

services:
  # ============================================
  # Jupyter Notebook + Spark (cliente)
  # ============================================
  jupyter:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.jupyter
    container_name: track-jupyter
    env_file:
      - .env
    volumes:
      - ./notebooks:/app/notebooks
      - /u01/track-data-platform
      - ./platform/shared-libs:/app/platform/shared-libs
      - ./domains:/app/domains
      - ./temp:/app/temp:ro
      - ./config:/app/config
      - ./connectors:/app/connectors
      - ./apps:/app/apps
      - ./spark/event-logs:/opt/bitnami/spark/event-logs
      - ./platform/infra/docker/spark-defaults.conf:/usr/local/spark/conf/spark-defaults.conf:ro
    extra_hosts:
      - "etbdb002:host-gateway"
    ports:
      - "8889:8888"
    networks:
      - track-network
    restart: unless-stopped
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      SPARK_MASTER: "spark://spark-master:7077"
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"

  oracle-tunnel:
    image: alpine:latest
    container_name: oracle-tunnel
    network_mode: host
    env_file:
      - .env
    volumes:
      - ${SSH_KEY:-/dev/null}:/root/.ssh/key_pop:ro
    command: >
      sh -c "
        apk add --no-cache openssh-client &&
        if [ -z \"$$SSH_GATEWAY\" ] || [ -z \"$$SSH_USER\" ]; then
          echo '⚠ Túnel SSH não configurado. Configure SSH_GATEWAY e SSH_USER no .env'
          echo '⚠ Continuando sem túnel...'
          sleep infinity
        else
          REMOTE_HOST=\"$$ORACLE_TUNNEL_HOST\"
          if [ -z \"$$REMOTE_HOST\" ]; then REMOTE_HOST=\"$$ORACLE_HOST\"; fi
          if [ -z \"$$REMOTE_HOST\" ]; then REMOTE_HOST=\"10.255.150.11\"; fi
          REMOTE_PORT=\"$$ORACLE_TUNNEL_PORT\"
          if [ -z \"$$REMOTE_PORT\" ]; then REMOTE_PORT=\"$$ORACLE_PORT\"; fi
          if [ -z \"$$REMOTE_PORT\" ]; then REMOTE_PORT=\"1521\"; fi
          if [ -n \"$$SSH_PASSWORD\" ]; then
            apk add --no-cache sshpass &&
            SSH_PREFIX=\"sshpass -p $$SSH_PASSWORD ssh\" &&
            SSH_OPTS=\"-o PreferredAuthentications=password -o PasswordAuthentication=yes\" &&
            echo 'Usando senha SSH (SSH_PASSWORD)'
          elif [ -f /root/.ssh/key_pop ] && [ -s /root/.ssh/key_pop ]; then
            cp /root/.ssh/key_pop /tmp/ssh_key &&
            chmod 600 /tmp/ssh_key &&
            SSH_PREFIX=\"ssh\" &&
            SSH_OPTS=\"-i /tmp/ssh_key -o PasswordAuthentication=no -o PreferredAuthentications=publickey -o PubkeyAuthentication=yes\" &&
            echo 'Usando chave SSH (SSH_KEY)'
          else
            echo '✗ SSH_KEY ou SSH_PASSWORD não configurado no .env'
            echo '⚠ Túnel SSH requer chave ou senha'
            sleep infinity
          fi
          echo 'Iniciando túnel SSH para Oracle...'
          echo \"Gateway: $$SSH_USER@$$SSH_GATEWAY\"
          echo \"Oracle remoto: $$REMOTE_HOST:$$REMOTE_PORT\"
          $$SSH_PREFIX -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3 $$SSH_OPTS -L $${LOCAL_PORT:-1521}:$${REMOTE_HOST}:$${REMOTE_PORT} -N -f $${SSH_USER}@$${SSH_GATEWAY} &&
          echo '✓ Túnel SSH ativo' &&
          sleep infinity
        fi
      "
    restart: unless-stopped
    profiles:
      - tunnel

  # ============================================
  # Spark Cluster
  # ============================================
  spark-master:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8081
    volumes:
      - ./platform/infra/docker/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./spark/event-logs:/opt/bitnami/spark/event-logs
    ports:
      - "8081:8081"
      - "7077:7077"
    networks:
      - track-network

  spark-worker-1:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_WEBUI_PORT=8082
    volumes:
      - ./platform/infra/docker/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./spark/event-logs:/opt/bitnami/spark/event-logs
    ports:
      - "8082:8082"
    networks:
      - track-network

  spark-history:
    image: bitnamilegacy/spark:3.5.6
    container_name: spark-history
    depends_on:
      - spark-master
    volumes:
      - ./platform/infra/docker/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
      - ./spark/event-logs:/opt/bitnami/spark/event-logs
    ports:
      - "18080:18080"
    networks:
      - track-network
    restart: unless-stopped
    command: ["/opt/bitnami/spark/sbin/start-history-server.sh"]
