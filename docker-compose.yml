version: "3.9"
version: '3.8'

# ============================================
# Track Data Platform - Docker Compose
# Ambiente de desenvolvimento local
# ============================================

services:
  # ============================================
  # Orchestrator - Orquestra pipelines
  # ============================================
  orchestrator:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.orchestrator
    container_name: track-orchestrator
    env_file:
      - .env
    volumes:
      - ./platform/shared-libs:/app/platform/shared-libs
      - ./domains:/app/domains
      - ./apps/orchestrator:/app/apps/orchestrator
      - ./logs:/app/logs
      - ./temp:/app/temp
    command: python -m apps.orchestrator.runner --domain data-pipeline --layer all
    networks:
      - track-network
    restart: unless-stopped

  # ============================================
  # Metadata Service - Catálogo e lineage
  # ============================================
  metadata-service:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.metadata
    container_name: track-metadata-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/metadata-service:/app/apps/metadata-service
      - ./platform/metadata:/app/platform/metadata
    networks:
      - track-network
    restart: unless-stopped

  # ============================================
  # Jupyter Notebook - Desenvolvimento
  # ============================================
  jupyter:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.jupyter
    container_name: track-jupyter
    ports:
      - "8888:8888"
    env_file:
      - .env
    volumes:
      - ./notebooks:/app/notebooks
      - ./platform/shared-libs:/app/platform/shared-libs
      - ./domains:/app/domains
      - ./temp:/app/temp
    networks:
      - track-network
    restart: unless-stopped
    environment:
      JUPYTER_ENABLE_LAB: "yes"

networks:
  track-network:
    driver: bridge
    name: track-platform-network

volumes:
  metadata-db:
    name: track-metadata-db
services:
  spark-master:
    image: bitnami/spark:latest
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - backend
    volumes:
      - ./data:/data

  spark-worker-1:
    image: bitnami/spark:latest
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    networks:
      - backend
    volumes:
      - ./data:/data

  etl_app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: etl_app
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./metadata:/metadata
      - ./config:/config
    networks:
      - backend
    depends_on:
      - spark-master

  jupyter_spark:
    build:
      context: .
      dockerfile: Dockerfile.jupyter-spark
    container_name: jupyter_spark
    env_file:
      - .env
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/data
      - ./config:/config
      - ./app:/home/jovyan/app
    networks:
      - backend
    depends_on:
      - spark-master

networks:
  backend:
    driver: bridge
