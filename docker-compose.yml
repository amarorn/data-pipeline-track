version: "3.9"

# ============================================
# Track Data Platform - Docker Compose
# Ambiente de desenvolvimento local
# ============================================

services:
  # ============================================
  # Orchestrator - Orquestra pipelines
  # ============================================
  orchestrator:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.orchestrator
    container_name: track-orchestrator
    env_file:
      - .env
    volumes:
      - ./platform/shared-libs:/app/platform/shared-libs
      - ./domains:/app/domains
      - ./apps/orchestrator:/app/apps/orchestrator
      - ./logs:/app/logs
      - ./temp:/app/temp
    command: python -m apps.orchestrator.runner --domain data-pipeline --layer all
    networks:
      - track-network
    restart: unless-stopped

  # ============================================
  # Metadata Service - Catálogo e lineage
  # ============================================
  metadata-service:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.metadata
    container_name: track-metadata-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/metadata-service:/app/apps/metadata-service
      - ./platform/metadata:/app/platform/metadata
    networks:
      - track-network
    restart: unless-stopped

  # ============================================
  # Jupyter Notebook - Desenvolvimento
  # ============================================
  jupyter:
    build:
      context: .
      dockerfile: platform/infra/docker/Dockerfile.jupyter
    container_name: track-jupyter
    ports:
      - "9999:8888"
    env_file:
      - .env
    volumes:
      - ./notebooks:/app/notebooks
      - ./platform/shared-libs:/app/platform/shared-libs
      - ./domains:/app/domains
      - ./temp:/app/temp
    networks:
      - track-network
    restart: unless-stopped
    environment:
      JUPYTER_ENABLE_LAB: "yes"

networks:
  track-network:
    driver: bridge
    name: track-platform-network

volumes:
  metadata-db:
    name: track-metadata-db
