version: "3.9"
version: '3.8'

services:
  # ============================================
  # Pipeline Runner - Executa ETL
  # ============================================
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: data-pipeline-runner
    env_file:
      - .env
    volumes:
      - ./layers:/app/layers
      - ./shared:/app/shared
      - ./logs:/app/logs
      - ./temp:/app/temp
    command: python -m shared.runner --layer all
    networks:
      - pipeline-network
    restart: unless-stopped

  # ============================================
  # Jupyter Notebook - Desenvolvimento
  # ============================================
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter-spark
    container_name: data-pipeline-jupyter
    ports:
      - "8888:8888"
    env_file:
      - .env
    volumes:
      - ./notebooks:/app/notebooks
      - ./layers:/app/layers
      - ./shared:/app/shared
      - ./temp:/app/temp
    networks:
      - pipeline-network
    restart: unless-stopped

networks:
  pipeline-network:
    driver: bridge
services:
  spark-master:
    image: bitnami/spark:latest
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - backend
    volumes:
      - ./data:/data

  spark-worker-1:
    image: bitnami/spark:latest
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_WEBUI_PORT=8081
    ports:
      - "8081:8081"
    networks:
      - backend
    volumes:
      - ./data:/data

  etl_app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: etl_app
    env_file:
      - .env
    volumes:
      - ./data:/data
      - ./metadata:/metadata
      - ./config:/config
    networks:
      - backend
    depends_on:
      - spark-master

  jupyter_spark:
    build:
      context: .
      dockerfile: Dockerfile.jupyter-spark
    container_name: jupyter_spark
    env_file:
      - .env
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/data
      - ./config:/config
      - ./app:/home/jovyan/app
    networks:
      - backend
    depends_on:
      - spark-master

networks:
  backend:
    driver: bridge
